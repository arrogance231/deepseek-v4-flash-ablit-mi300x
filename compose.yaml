name: deepseek-v4-flash-ablit

services:
  inference:
    image: ${VLLM_IMAGE:-vllm/vllm-openai-rocm@sha256:e68d18b2ba50298661bfc49baf01158fbf036645c2362cccf3e8a7a79fe6c69a}
    restart: unless-stopped
    init: true
    ipc: host
    cap_add: [SYS_PTRACE, IPC_LOCK]
    ulimits:
      memlock: -1
    security_opt: [seccomp=unconfined, label=disable]
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    # Keep vLLM on host loopback; public access is through authenticated Caddy.
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    environment:
      VLLM_ROCM_USE_AITER: "1"
      VLLM_ROCM_OPUS_PREFILL: "1"
      VLLM_ROCM_USE_SKINNY_GEMM: "0"
      ROCP_TOOL_ATTACH: "1"
      HSA_COREDUMP_PATTERN: /var/crash/vllm/gpucore.%p
      AITER_CONFIG_GEMM_A8W8_BLOCKSCALE_BPRESHUFFLE: /opt/aiter-configs/dsv4-mi300x-a8w8-blockscale-bpreshuffle.csv
      DISABLE_DSPARK: "${DISABLE_DSPARK:-0}"
      VLLM_API_KEY: "${VLLM_API_KEY:-}"
    volumes:
      # The checkpoint is downloaded outside the container and never copied into Git.
      - ${MODEL_DIR:-/mnt/model-storage/DeepSeek-V4-Flash-DSpark-Abliterated-Uncensored}:/models/deepseek:ro
      - ${HF_CACHE_DIR:-/root/.cache/huggingface}:/root/.cache/huggingface:ro
      - ./aiter-cache:/root/.aiter
      - ./crash-dumps:/var/crash/vllm
      - ./vllm-entrypoint.sh:/opt/vllm-entrypoint.sh:ro
      - ./tuning/dsv4-mi300x-a8w8-blockscale-bpreshuffle-ck.batch4096.csv:/opt/aiter-configs/dsv4-mi300x-a8w8-blockscale-bpreshuffle.csv:ro
      - ./tuning/dsv4-a8w8-blockscale-tuned-gemm.mi300x.decode-candidate.csv:/usr/local/lib/python3.12/dist-packages/aiter/configs/model_configs/dsv4_a8w8_blockscale_tuned_gemm.csv:ro
      # Fix padded MXFP4 lanes misrouting tokens (doublewordai/vllm-amd-blog-doubleword@c32932bb9).
      - ./patches/gpt_oss_triton_kernels_moe.row-i8asym-candidate.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/fused_moe/experts/gpt_oss_triton_kernels_moe.py:ro
      - ./kernel-dev/hip-a8w4:/opt/cj-moe
      - ./profiles-current:/profiles-current
      - ./patches/mxfp4.fused-silu.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/fused_moe/oracle/mxfp4.py:ro
      - ./patches/activation.rocm-exact-swiglu.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/activation.py:ro
      - ./patches/block_table.active-width-copy.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/worker/block_table.py:ro
      - ./patches/deepseek_v4_amd_model.router-bf16.py:/usr/local/lib/python3.12/dist-packages/vllm/models/deepseek_v4/amd/model.py:ro
      - ./patches/triton-kernels-matmul-ogs-opt-flags.dsv4-mi300x.py:/usr/local/lib/python3.12/dist-packages/vllm/third_party/triton_kernels/matmul_ogs_details/opt_flags.py:ro
      - ./patches/fused_compress_quant_cache.fnuz-shuffle.py:/usr/local/lib/python3.12/dist-packages/vllm/models/deepseek_v4/common/ops/fused_compress_quant_cache.py:ro
      - ./patches/cache_utils.gather2048.py:/usr/local/lib/python3.12/dist-packages/vllm/models/deepseek_v4/common/ops/cache_utils.py:ro
      - ./patches/aiter_pa_mqa_logits.i64.py:/usr/local/lib/python3.12/dist-packages/aiter/ops/triton/gluon/pa_mqa_logits.py:ro
      - ./patches/rocm_aiter_mla_sparse.decode-h32-k16.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/attention/ops/rocm_aiter_mla_sparse.py:ro
      - ./patches/_C_stable_libtorch.topk-tiebreak-sanitize.abi3.so:/usr/local/lib/python3.12/dist-packages/vllm/_C_stable_libtorch.abi3.so:ro
      - ./patches/deepseek_v4_attention.wqb-bpreshuffle.py:/usr/local/lib/python3.12/dist-packages/vllm/models/deepseek_v4/attention.py:ro
      - ./patches/deepseek_v4_rocm.wqb-bpreshuffle.py:/usr/local/lib/python3.12/dist-packages/vllm/models/deepseek_v4/amd/rocm.py:ro
      # vLLM 77469c9: keep speculative verify attention causal on ROCm small-head MLA.
      - ./patches/rocm_aiter_mla.dspark-causal.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/attention/backends/mla/rocm_aiter_mla.py:ro
      - ./patches/dspark-speculator.independent-draft-gumbel.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/worker/gpu/spec_decode/dspark/speculator.py:ro
      - ./patches/spec-decode-utils.independent-draft-gumbel.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/worker/gpu/spec_decode/utils.py:ro
      # Fence native CPU KV transfers behind in-flight compute (vLLM #47282 / PR #47291).
      - ./patches/kv_offload_cpu_gpu_worker.load-war.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/kv_offload/cpu/gpu_worker.py:ro
      # Use the full prefill quantum only when no other request can be delayed.
      - ./patches/scheduler.contention-aware.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/core/sched/scheduler.py:ro
    entrypoint: [/opt/vllm-entrypoint.sh]
    command:
      - ${MODEL_PATH:-/models/deepseek}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --served-model-name
      - ${SERVED_MODEL_NAME:-deepseek-v4-flash}
      - --trust-remote-code
      - --tokenizer-mode
      - deepseek_v4
      - --generation-config
      - vllm
      - --reasoning-parser
      - deepseek_v4
      - --tool-call-parser
      - deepseek_v4
      - --enable-auto-tool-choice
      - --enable-prompt-tokens-details
      - --kv-cache-dtype
      - fp8
      - --block-size
      - "256"
      - --max-model-len
      - "${MAX_MODEL_LEN:-393216}"
      - --kv-cache-memory-bytes
      - "16000000000"
      - --kv-offloading-size
      - "96"
      - --kv-offloading-backend
      - native
      - --max-num-seqs
      - "${MAX_NUM_SEQS:-8}"
      - --max-num-batched-tokens
      - "4096"
      - --long-prefill-token-threshold
      - "1024"
      - --moe-backend
      - triton
      - --linear-backend
      - auto
      - --speculative-config.method=dspark
      - --speculative-config.num-speculative-tokens=${DS_NUM_SPECULATIVE_TOKENS:-5}
      - --speculative-config.draft-sample-method=probabilistic
      - --speculative-config.rejection-sample-method=block
      - --compilation-config
      - '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[1,2,4,8,16,24,32,40,48,56,64,72,80,88,96,104,112,120,128,136,144,152,160,168,176,184,192,200,208,216,224,232,240,248,256,272,288,304,320,336,352,368,384,400,416,432,448,464,480,496,512,1664,2048,3072,3712],"max_cudagraph_capture_size":3712}'
      - --profiler-config.profiler=torch
      - --profiler-config.torch_profiler_dir=/profiles-current
      - --profiler-config.torch_profiler_with_stack=false
      - --profiler-config.torch_profiler_use_gzip=false
      - --profiler-config.torch_profiler_record_shapes=true
      - --profiler-config.ignore_frontend=true
      - --profiler-config.detailed_trace_annotation=true
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8000/health]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 6m
    stop_grace_period: 2m
    logging:
      options:
        max-size: 100m
        max-file: "5"

  caddy:
    profiles: [proxy]
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    environment:
      VLLM_API_KEY: "${VLLM_API_KEY:-}"
    ports:
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      options:
        max-size: 100m
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
